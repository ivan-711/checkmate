# One documented command brings up the database and the API (G16 step 1).
# Everything binds to 127.0.0.1. The database holds only synthetic data and is rebuilt
# from the seed: `docker compose down -v && docker compose up`.
services:
  db:
    image: timescale/timescaledb-ha:pg18@sha256:75b1a432956ae6efc31551413ba51b6601ec0910dbad123a64617face989dc7c  # PG 18.6, TimescaleDB 2.30.2, pinned 2026-10-17
    environment:
      POSTGRES_USER: checkmate
      POSTGRES_PASSWORD: checkmate
      POSTGRES_DB: checkmate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - checkmate-db:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkmate -d checkmate"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://checkmate:checkmate@db:5432/checkmate
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      FRONTDESK_AGENT_MODE: REPLAY
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  checkmate-db:
